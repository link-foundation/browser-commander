name: Feature Parity Matrix

on:
  push:
    branches: [main]
    paths:
      - 'docs/feature-parity.md'
      - 'docs/feature-parity/**'
      - 'js/tests/**'
      - 'python/tests/**'
      - 'rust/src/**'
      - 'rust/tests/**'
      - 'scripts/generate-feature-parity.mjs'
      - 'README.md'
      - 'js/src/browser/browser-sources.json'
      - 'scripts/generate-browser-support.mjs'
      - '.github/workflows/feature-parity.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/feature-parity.md'
      - 'docs/feature-parity/**'
      - 'js/tests/**'
      - 'python/tests/**'
      - 'rust/src/**'
      - 'rust/tests/**'
      - 'scripts/generate-feature-parity.mjs'
      - 'README.md'
      - 'js/src/browser/browser-sources.json'
      - 'scripts/generate-browser-support.mjs'
      - '.github/workflows/feature-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-matrix
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Reject missing or stale parity claims
        run: node scripts/generate-feature-parity.mjs --check
      - name: Reject a stale importable-browser matrix
        run: node scripts/generate-browser-support.mjs --check

  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    needs: [matrix]
    if: >-
      !cancelled()
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Report failed or cancelled jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          RUN_SHA: ${{ github.sha }}
        run: bash scripts/check-pipeline-status.sh

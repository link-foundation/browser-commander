name: Browser Parity

# Proves against a real Chrome that a browser this library drives reports the
# same environment as one a person started by hand. Every other workflow tests
# the library against its own expectations; this one tests it against the
# browser, so it is the only check that notices when a Chrome or engine update
# reopens a gap -- the way Playwright 1.62 did by starting to push
# `--enable-unsafe-swiftshader` on every platform.
#
# It is scheduled rather than push-triggered because the thing that breaks it
# usually is not a commit: Chrome ships every few weeks whether or not this
# repository changed. Pull requests run it too, but only when they touch the
# parity code itself, since the suite needs a display and several browser
# launches.

on:
  schedule:
    # Weekly, on Monday morning UTC. Chrome's stable channel moves roughly
    # every four weeks, so a week is short enough to attribute a regression to
    # one browser release.
    - cron: '17 5 * * 1'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # The engine-suites job drives the whole commander API through both
      # Node engines, so any source change, or a Playwright or Puppeteer bump
      # in the lockfile, is something it can catch.
      - 'js/src/**'
      - 'js/package.json'
      - 'js/package-lock.json'
      - 'js/tests/e2e/**'
      - 'js/tests/helpers/**'
      - 'js/examples/react-test-app/**'
      - 'experiments/fingerprint-parity/**'
      - 'js/src/cli/**'
      - 'js/bin/**'
      - 'tests/cli-contract/**'
      - 'python/src/**'
      - 'python/tests/e2e/**'
      - 'rust/src/**'
      - 'rust/tests/storage_state_smoke.rs'
      - 'rust/tests/snapshot.rs'
      - 'rust/tests/reusable_session.rs'
      - 'rust/tests/parity.rs'
      - 'rust/tests/webdriver*.rs'
      - 'rust/tests/playwright_driver.rs'
      - 'rust/tests/puppeteer_bridge.rs'
      - 'rust/tests/trace_record_real_browser.rs'
      - 'rust/tests/launch_smoke.rs'
      - 'rust/tests/connect_smoke.rs'
      - 'rust/tests/real_browser_smoke.rs'
      - 'rust/tests/support/**'
      - '.github/workflows/parity.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # Both the reference capture and the automated captures drive this binary, so
  # a difference in the report is a difference in how the browser was started.
  CHROME_PATH: /usr/bin/google-chrome

jobs:
  parity:
    name: Fingerprint Parity (real Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-parity
      cancel-in-progress: true
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install dependencies
        # --ignore-scripts skips Puppeteer's browser download on purpose: the
        # suite launches the runner's own Chrome through executablePath.
        run: npm ci --ignore-scripts

      - name: Verify the suite can actually run
        # The suite skips itself when Chrome or a display is missing, and a
        # skipped suite still exits zero. Without this step a green run could
        # mean nothing was asserted.
        run: |
          test -x "$CHROME_PATH" || {
            echo "::error::no Chrome binary at $CHROME_PATH"
            exit 1
          }
          "$CHROME_PATH" --version
          command -v xvfb-run >/dev/null || {
            echo "::error::xvfb-run is missing; the headful half needs a display"
            exit 1
          }

      - name: Give the preinstalled browsers a usable sandbox
        # The measureParity suite also starts the runner's Chromium and Edge by
        # hand. On ubuntu-24.04 both abort before opening a window: AppArmor
        # blocks the unprivileged user namespaces Chromium's sandbox needs
        # ("No usable sandbox!"), and Edge's SUID helper ships without the
        # setuid bit ("msedge-sandbox is owned by root and has mode ...").
        # Fixing the host rather than passing --no-sandbox keeps the reference
        # command line exactly what a person would type.
        working-directory: .
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if [ -e /opt/microsoft/msedge/msedge-sandbox ]; then
            sudo chown root:root /opt/microsoft/msedge/msedge-sandbox
            sudo chmod 4755 /opt/microsoft/msedge/msedge-sandbox
          fi

      - name: Run parity suite under Xvfb
        # A display is only needed by the headful half, but running both halves
        # under the same server keeps the two references comparable.
        #
        # The reporter is pinned to TAP because the next step reads the output.
        # Node's spec reporter marks a skipped suite with a small-minus glyph
        # and prints the reason with no "SKIP" in it, so a grep written against
        # TAP would pass over exactly the case it exists to catch.
        shell: bash
        # The budget, not `timeout-minutes`, owns this step's deadline: a job
        # killed by `timeout-minutes` is reported as cancelled rather than
        # failed. See docs/CI-TIMEOUT-BUDGETS.md.
        run: |
          bash ../scripts/run-with-budget-warning.sh 1200 "Fingerprint parity suite" \
            bash -c 'set -o pipefail; RUN_E2E=true xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:e2e:parity -- --reporter tap 2>&1 | tee parity.log'

      - name: Fail on a suite that asserted nothing
        # Belt and braces for the check above: a skip condition added later
        # would otherwise pass unnoticed, because a skipped suite exits zero.
        run: |
          if grep -q '# SKIP' parity.log; then
            echo "::error::the parity suite skipped a case instead of asserting it"
            grep '# SKIP' parity.log
            exit 1
          fi
          passed=$(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' parity.log | tail -1)
          if [ "${passed:-0}" -eq 0 ]; then
            echo "::error::the parity suite reported no passing tests"
            exit 1
          fi
          echo "parity suite passed $passed tests against a real Chrome"

      - name: Verify native browser window has no default-browser infobar
        working-directory: .
        run: |
          python -m pip install mss pillow
          PYTHONPATH=python/src xvfb-run -a --server-args="-screen 0 1360x900x24" \
            python experiments/issue-110/capture-infobar.py

      - name: Verify stable viewport in the displayed browser window
        working-directory: .
        shell: bash
        run: |
          bash scripts/run-with-budget-warning.sh 60 "Stable viewport displayed-pixel regression" \
            xvfb-run -a --server-args="-screen 0 900x700x24" \
            python experiments/issue-146/watch-viewport.py

      - name: Run WebDriver suite under Xvfb
        # The selenium engine drives the same Chrome through chromedriver
        # (issue #104). launchWebDriver() finds a chromedriver on PATH or asks
        # Selenium Manager (shipped inside selenium-webdriver) for one matching
        # $CHROME_PATH, so nothing else needs installing. The suite asserts
        # navigator.webdriver stays false under chromedriver, which is the
        # WebDriver half of the parity this workflow guards. It took 44s
        # locally; the job backstop was raised to 40 minutes to cover both
        # budgets (docs/CI-TIMEOUT-BUDGETS.md).
        shell: bash
        run: |
          bash ../scripts/run-with-budget-warning.sh 300 "WebDriver suite" \
            bash -c 'set -o pipefail; RUN_E2E=true xvfb-run -a --server-args="-screen 0 1920x1080x24" node scripts/run-tests.mjs --reporter tap tests/e2e/webdriver.e2e.test.js tests/e2e/engine-matrix.e2e.test.js 2>&1 | tee webdriver.log'

      - name: Fail on a WebDriver suite that asserted nothing
        # The runner has no Firefox, so the Firefox half is the only skip
        # allowed; the Chrome half must have run.
        run: |
          if grep '# SKIP' webdriver.log | grep -v 'firefox is not installed'; then
            echo "::error::the WebDriver suite skipped a Chrome case instead of asserting it"
            exit 1
          fi
          passed=$(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' webdriver.log | tail -1)
          if [ "${passed:-0}" -eq 0 ]; then
            echo "::error::the WebDriver suite reported no passing tests"
            exit 1
          fi
          echo "WebDriver suite passed $passed tests against a real Chrome"

      - name: Upload parity log
        # ${{ }} wrapping is required: a plain YAML scalar cannot begin with the
        # tag indicator "!".
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: parity-log
          path: |
            js/parity.log
            js/webdriver.log
          retention-days: 14

  # The browser-commander CLI and its serve --stdio bridge (issue #104) against
  # the same real Chrome: `run tests/cli-contract/basic.json` must match the
  # expected output the Rust and Python CLIs are held to, and handle.describe
  # must reach every method Playwright and Puppeteer declare. It is its own job
  # so its budget does not eat into the parity suite's.
  cli:
    name: CLI and bridge (real Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-cli
      cancel-in-progress: true
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python package
        working-directory: .
        run: python -m pip install -e ./python

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache Cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cli-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cli-cargo-

      - name: Build Rust CLI
        working-directory: rust
        shell: bash
        run: bash ../scripts/run-with-budget-warning.sh 900 "Rust CLI build" cargo build --locked

      - name: Verify Chrome is present
        run: |
          test -x "$CHROME_PATH" || {
            echo "::error::no Chrome binary at $CHROME_PATH"
            exit 1
          }
          "$CHROME_PATH" --version

      - name: Run CLI and API coverage suites under Xvfb
        shell: bash
        run: |
          bash ../scripts/run-with-budget-warning.sh 300 "CLI and API coverage suites" \
            bash -c 'set -o pipefail; RUN_E2E=true xvfb-run -a --server-args="-screen 0 1920x1080x24" node scripts/run-tests.mjs --reporter tap tests/e2e/cli.e2e.test.js tests/e2e/api-coverage.e2e.test.js 2>&1 | tee cli.log'

      - name: Fail on a suite that asserted nothing
        run: |
          if grep -q '# SKIP' cli.log; then
            echo "::error::the CLI suites skipped a case instead of asserting it"
            grep '# SKIP' cli.log
            exit 1
          fi
          passed=$(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' cli.log | tail -1)
          if [ "${passed:-0}" -eq 0 ]; then
            echo "::error::the CLI suites reported no passing tests"
            exit 1
          fi
          echo "CLI suites passed $passed tests against a real Chrome"

      - name: Compare all three CLIs against the shared browser contract
        working-directory: .
        shell: bash
        run: bash scripts/run-with-budget-warning.sh 300 "Cross-language CLI contract" node tests/cli-contract/check.mjs

  # Compiling the storage-state integration test has its own budget so it
  # cannot consume the CLI job's build and browser-test allowance.
  storage-state:
    name: Rust storage state (real Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-storage-state
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Install browser engines
        working-directory: js
        run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Cache Cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-storage-state-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-storage-state-cargo-
            ${{ runner.os }}-cli-cargo-
      - name: Verify Chrome is present
        run: test -x "$CHROME_PATH"
      - name: Transfer Rust storage state across engines
        working-directory: rust
        shell: bash
        run: |
          bash ../scripts/run-with-budget-warning.sh 600 "Rust storage state transfer" \
            cargo test --locked --test storage_state_smoke -- --ignored --nocapture

  snapshots:
    name: Native snapshots (real Chrome)
    runs-on: ubuntu-24.04
    # 30 rather than 20 since the headful Python and Rust launch smokes joined
    # (issue #128): its four budgets sum to 1260s, above the 840s that 70% of
    # 20 minutes allows.
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-snapshots
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Install browser engines
        working-directory: js
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install -e './python[dev]'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Cache Cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-snapshots-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-snapshots-cargo-
            ${{ runner.os }}-storage-state-cargo-
      - name: Verify Chrome is present
        run: test -x "$CHROME_PATH"
      - name: Resolve matching native WebDriver
        run: node experiments/issue-110/resolve-webdriver.mjs >> "$GITHUB_ENV"
      - name: Run Rust snapshots and parity in all CDP engines
        working-directory: rust
        env:
          # Only the Puppeteer bridge test reads it: it launches Chrome through
          # the JavaScript CLI's serve --stdio rather than a Rust launcher.
          CHROME_NO_SANDBOX: 'true'
        shell: bash
        run: |
          bash ../scripts/run-with-budget-warning.sh 600 "Rust native snapshots and parity" \
            cargo test --locked --test reusable_session --test snapshot --test parity --test webdriver --test playwright_driver --test puppeteer_bridge --test trace_record_real_browser -- --ignored --nocapture
      - name: Launch Python snapshot copies and record a Python trace
        env:
          RUN_E2E: 'true'
          CHROME_NO_SANDBOX: 'true'
        shell: bash
        run: |
          bash scripts/run-with-budget-warning.sh 180 "Python native snapshot launches" \
            python -m pytest python/tests/e2e/test_reusable_session.py python/tests/e2e/test_snapshot.py python/tests/e2e/test_puppeteer_bridge.py python/tests/e2e/test_trace_recording.py python/tests/e2e/test_engine_matrix.py -v
      - name: Launch headful Python browsers under Xvfb
        # These two launch a visible window, so without a display they skip --
        # and a skipped pytest run exits zero. Until issue #128 no workflow ran
        # them at all. The grep turns a skip into a failure.
        env:
          RUN_E2E: 'true'
          CHROME_NO_SANDBOX: 'true'
        shell: bash
        run: |
          bash scripts/run-with-budget-warning.sh 180 "Python headful real-browser launches" \
            bash -c 'set -o pipefail; xvfb-run -a --server-args="-screen 0 1920x1080x24" python -m pytest python/tests/e2e/test_real_browser_webdriver.py python/tests/e2e/test_portable_storage_state.py -v -rs 2>&1 | tee python-headful.log'
          if grep -qE '[0-9]+ skipped' python-headful.log; then
            echo "::error::a headful Python suite skipped instead of asserting"
            exit 1
          fi
      - name: Launch and attach Rust engines to the installed Chrome
        # #[ignore]d smoke tests that no workflow ran until issue #128. One of
        # them launches headful, hence the display.
        working-directory: rust
        shell: bash
        run: |
          bash ../scripts/run-with-budget-warning.sh 300 "Rust launch and connect smokes" \
            xvfb-run -a --server-args="-screen 0 1920x1080x24" cargo test --locked --test launch_smoke --test connect_smoke --test real_browser_smoke -- --ignored --nocapture

  # The JavaScript suites that drive both Node engines through a whole
  # lifecycle: click readiness, managed downloads and portable traces. They
  # skip without RUN_E2E, and until issue #128 no workflow set it for them.
  engine-suites:
    name: Engine lifecycle suites (real Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-engine-suites
      cancel-in-progress: true
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright's headless Chromium
        # The click-readiness suite launches Playwright's own Chromium rather
        # than $CHROME_PATH, and --ignore-scripts above skips its download.
        run: npx playwright install --with-deps --only-shell chromium

      - name: Verify Chrome is present
        run: |
          test -x "$CHROME_PATH" || {
            echo "::error::no Chrome binary at $CHROME_PATH"
            exit 1
          }
          "$CHROME_PATH" --version

      - name: Run engine lifecycle suites under Xvfb
        shell: bash
        run: |
          bash ../scripts/run-with-budget-warning.sh 1200 "Engine lifecycle suites" \
            bash -c 'set -o pipefail; RUN_E2E=true xvfb-run -a --server-args="-screen 0 1920x1080x24" node scripts/run-tests.mjs --reporter tap tests/e2e/navigation-budget.e2e.test.js tests/e2e/reusable-session.e2e.test.js tests/e2e/click-readiness.e2e.test.js tests/e2e/downloads.e2e.test.js tests/e2e/traces.e2e.test.js 2>&1 | tee engine-suites.log'

      - name: Fail on a suite that asserted nothing
        run: |
          if grep -q '# SKIP' engine-suites.log; then
            echo "::error::an engine lifecycle suite skipped a case instead of asserting it"
            grep '# SKIP' engine-suites.log
            exit 1
          fi
          passed=$(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' engine-suites.log | tail -1)
          if [ "${passed:-0}" -eq 0 ]; then
            echo "::error::the engine lifecycle suites reported no passing tests"
            exit 1
          fi
          echo "engine lifecycle suites passed $passed tests against a real Chrome"

  # The Playwright and Puppeteer suites exercise the commander API against the
  # React fixture app in js/examples/react-test-app, which they expect on
  # http://localhost:3000. Like the suites above, nothing ran them before
  # issue #128.
  fixture-suites:
    name: React fixture suites (real Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-fixture-suites
      cancel-in-progress: true
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Serve the React fixture app
        # A production build behind `vite preview`, so no file watcher or
        # hot-reload socket is part of what the suites measure. The server
        # outlives this step and is stopped with the job.
        working-directory: js/examples/react-test-app
        run: |
          npm ci --ignore-scripts
          npm run build
          nohup npm run preview -- --port 3000 --strictPort > fixture-server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000 >/dev/null && exit 0
            sleep 1
          done
          echo "::error::the React fixture app did not start on port 3000"
          cat fixture-server.log
          exit 1

      - name: Verify Chrome is present
        run: |
          test -x "$CHROME_PATH" || {
            echo "::error::no Chrome binary at $CHROME_PATH"
            exit 1
          }
          "$CHROME_PATH" --version

      - name: Run Playwright and Puppeteer suites under Xvfb
        shell: bash
        run: |
          bash ../scripts/run-with-budget-warning.sh 1500 "React fixture suites" \
            bash -c 'set -o pipefail; RUN_E2E=true xvfb-run -a --server-args="-screen 0 1920x1080x24" node scripts/run-tests.mjs --reporter tap tests/e2e/playwright.e2e.test.js tests/e2e/puppeteer.e2e.test.js 2>&1 | tee fixture-suites.log'

      - name: Fail on a suite that asserted nothing
        run: |
          if grep -q '# SKIP' fixture-suites.log; then
            echo "::error::a React fixture suite skipped a case instead of asserting it"
            grep '# SKIP' fixture-suites.log
            exit 1
          fi
          passed=$(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' fixture-suites.log | tail -1)
          if [ "${passed:-0}" -eq 0 ]; then
            echo "::error::the React fixture suites reported no passing tests"
            exit 1
          fi
          echo "React fixture suites passed $passed tests against a real Chrome"

  # === PIPELINE STATUS ===
  # The only job that can tell "somebody pressed stop" apart from "a check ran
  # out of time". GitHub reports a job killed by its `timeout-minutes` as
  # cancelled rather than failed, and a run whose only casualty is a cancelled
  # job carries the conclusion `cancelled` as well, so the failure would pass
  # unannounced. See scripts/check-pipeline-status.sh.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    needs:
      - parity
      - cli
      - storage-state
      - snapshots
      - engine-suites
      - fixture-suites
    # A status function is required here, or the gate would inherit the implicit
    # "every dependency succeeded" condition and be skipped in exactly the runs
    # it exists to report. `!cancelled()` keeps it out of a superseded run,
    # where every job is cancelled and there is nothing to report.
    if: >-
      !cancelled()
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-pipeline-status.sh

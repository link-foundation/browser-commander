name: Rust CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - 'scripts/**'
      - '.github/workflows/rust.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rust/**'
      - 'scripts/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

permissions:
  # Read-only by default; the release jobs opt into `contents: write` and the
  # rest of the token scopes they need in their own `permissions:` blocks.
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

defaults:
  run:
    working-directory: rust

jobs:
  # === DETECT CHANGES - determines which jobs should run ===
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-detect-changes
      cancel-in-progress: true
    if: github.event_name != 'workflow_dispatch'
    outputs:
      rs-changed: ${{ steps.changes.outputs.rs-changed }}
      toml-changed: ${{ steps.changes.outputs.toml-changed }}
      mjs-changed: ${{ steps.changes.outputs.mjs-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
      rust-code-changed: ${{ steps.changes.outputs.rust-code-changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Detect changes
        id: changes
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/detect-code-changes.mjs

  # === CHANGELOG CHECK - only runs on PRs with code changes ===
  # Docs-only PRs (./docs folder, markdown files) don't require changelog fragments
  changelog:
    name: Changelog Fragment Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-changelog
      cancel-in-progress: true
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.rust-code-changed == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changelog fragments
        # GITHUB_BASE_REF is passed as an environment variable rather than
        # interpolated into the script body: a branch name is attacker-controlled
        # data on pull_request events.
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Get list of fragment files (excluding README and template)
          FRAGMENTS=$(find changelog.d -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)

          # Get changed files in PR
          CHANGED_FILES=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")

          # Check if any source files changed (excluding docs and config)
          SOURCE_CHANGED=$(printf '%s\n' "$CHANGED_FILES" | grep -cE "^rust/(src/|tests/|Cargo\.toml)" || true)

          if [ "$SOURCE_CHANGED" -gt 0 ] && [ "$FRAGMENTS" -eq 0 ]; then
            echo "::error::No changelog fragment found. Please add a changelog entry in rust/changelog.d/"
            echo ""
            echo "To create a changelog fragment:"
            echo "  Create a new .md file in rust/changelog.d/ with your changes"
            echo ""
            echo "See rust/changelog.d/README.md for more information."
            exit 1
          fi

          echo "Changelog check passed"

  # === LINT AND FORMAT CHECK ===
  # Lint runs independently of changelog check - it's a fast check that should always run
  # Note: !cancelled() is required because detect-changes is skipped on workflow_dispatch,
  # and without it, this job would also be skipped even though its condition includes workflow_dispatch.
  # See: https://github.com/actions/runner/issues/491
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    needs: [detect-changes]
    if: |
      !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.mjs-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: simulate-fresh-merge.sh needs a merge base.
          fetch-depth: 0

      # Lint the state that will exist after the merge, not the stale merge
      # preview GitHub built when the pull request was last synced.
      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # The job default working-directory is the language subdirectory, and
        # the shared script lives at the repository root. shell: bash is
        # explicit because the Windows runners default to pwsh.
        working-directory: .
        shell: bash
        run: bash scripts/simulate-fresh-merge.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

      - name: Check file size limit
        working-directory: .
        run: node rust/scripts/check-file-size.mjs

  # === TEST ===
  # Test runs independently of changelog check
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.os }}
      cancel-in-progress: true
    needs: [detect-changes, changelog]
    # Run if: push event, OR changelog succeeded, OR changelog was skipped (docs-only PR)
    # Note: !cancelled() is required to evaluate the condition when dependencies are skipped.
    if: >-
      !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog.result == 'success' || needs.changelog.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: simulate-fresh-merge.sh needs a merge base.
          fetch-depth: 0

      # Test the state that will exist after the merge. This is the check that
      # catches a semantic conflict: two pull requests that each pass alone but
      # break the suite once both are on the base branch.
      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # The job default working-directory is the language subdirectory, and
        # the shared script lives at the repository root. shell: bash is
        # explicit because the Windows runners default to pwsh.
        working-directory: .
        shell: bash
        run: bash scripts/simulate-fresh-merge.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        shell: bash
        # The budget, not `timeout-minutes`, owns this step's deadline: a job
        # killed by `timeout-minutes` is reported as cancelled rather than
        # failed. See docs/CI-TIMEOUT-BUDGETS.md.
        run: >-
          bash ../scripts/run-with-budget-warning.sh 480 "Rust test suite"
          cargo test --all-features --verbose

      - name: Run doc tests
        shell: bash
        run: >-
          bash ../scripts/run-with-budget-warning.sh 180 "Rust doc tests"
          cargo test --doc --verbose

  # === OPENSSL-FREE BUILD ===
  # Regression guard for issue #77: taking `fantoccini` with its default
  # features pulled `openssl-sys` into every consumer's tree, so the crate
  # stopped building on any image that has a Rust toolchain but no pkg-config
  # and no OpenSSL headers. This job reproduces exactly that environment -- a
  # stock rust:slim-bookworm with no `apt-get install` step -- and additionally
  # asserts that `openssl-sys` is absent from the default-feature graph.
  no-openssl:
    name: OpenSSL-free Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-no-openssl
      cancel-in-progress: true
    needs: [detect-changes]
    if: |
      !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    container:
      image: rust:slim-bookworm
    steps:
      - uses: actions/checkout@v6

      # `cargo tree -i` exits non-zero with "did not match any packages" when
      # nothing depends on the spec, which is precisely the state we want. Any
      # other outcome -- a successful lookup, i.e. openssl-sys present -- fails.
      - name: Assert openssl-sys is absent from the default-feature graph
        # `set -eu` rather than `set -euo pipefail`: bash is not on PATH in this
        # container, so GitHub falls back to `sh -e`, which has no `pipefail`.
        run: |
          set -eu
          if cargo tree --locked -i openssl-sys > openssl-tree.txt 2>&1; then
            echo "::error::openssl-sys is back in the dependency tree:"
            cat openssl-tree.txt
            exit 1
          fi
          grep -q "did not match any packages" openssl-tree.txt
          echo "openssl-sys is not in the default-feature dependency tree"

      - name: Build with default features and no system TLS libraries
        run: cargo build --locked --verbose

  # === CODE COVERAGE ===
  # The Python pipeline already reports coverage; without this job the Rust
  # implementation was the only one whose coverage could regress unobserved.
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-coverage
      cancel-in-progress: true
    needs: [test]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    # Same gate as build: whenever the suite actually ran and passed, report its
    # coverage. Re-testing the detect-changes outputs here would add a second,
    # stricter filter that silently drops the report on runs where the tests did
    # execute -- coverage would stop updating with nothing saying so.
    # !cancelled() is required because test can itself follow a skipped
    # dependency. See: https://github.com/actions/runner/issues/491
    if: >-
      !cancelled() && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-llvm-cov

      - name: Generate code coverage
        shell: bash
        # The budget, not `timeout-minutes`, owns this step's deadline: a job
        # killed by `timeout-minutes` is reported as cancelled rather than
        # failed. See docs/CI-TIMEOUT-BUDGETS.md.
        run: >-
          bash ../scripts/run-with-budget-warning.sh 480 "Rust code coverage"
          cargo llvm-cov --all-features --lcov --output-path lcov.info

      # Gate on the token rather than uploading unconditionally: without it the
      # action fails on forks, which have no secrets. With the token present an
      # upload error is a real failure, so fail_ci_if_error is true -- a silent
      # upload failure is exactly the kind of false negative this pipeline is
      # being audited for.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: rust/lcov.info
          disable_search: true
          fail_ci_if_error: true
          flags: rust

      - name: Report skipped Codecov upload
        if: env.CODECOV_TOKEN == ''
        run: echo "::notice::Skipping Codecov upload because CODECOV_TOKEN is not configured"

  # === BUILD ===
  # Build package - only runs if lint and test pass
  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    needs: [lint, test]
    # Note: !cancelled() ensures this job runs even when lint/test were skipped.
    if: >-
      !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release
        run: cargo build --release --verbose

      - name: Check package
        run: cargo package --list

  # === AUTO RELEASE ===
  # Automatic release on push to main using changelog fragments
  # This job automatically bumps version based on fragments in changelog.d/
  auto-release:
    name: Auto Release
    needs: [lint, test, build]
    timeout-minutes: 30
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    # Note: !cancelled() is required to evaluate the condition when dependencies are skipped.
    # The build job ensures lint and test passed before this job runs.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine bump type from changelog fragments
        id: bump_type
        run: node scripts/get-bump-type.mjs

      - name: Check if version already released or no fragments
        id: check
        run: |
          # Read [package] only: Cargo.toml repeats `name` under [[bin]] and
          # [lib], and `head -1` would silently depend on table ordering.
          CURRENT_VERSION=$(node ../scripts/read-manifest.mjs Cargo.toml)
          CRATE_NAME=$(node ../scripts/read-manifest.mjs Cargo.toml --field name)

          # Check if version is published on crates.io (the source of truth for Rust packages)
          # Note: We check crates.io, not git tags, because git tags can exist without
          # the package being published (e.g., failed publish, GitHub-only releases)
          CRATES_IO_RESPONSE=$(curl -s -H "User-Agent: browser-commander CI (github.com/link-foundation/browser-commander)" "https://crates.io/api/v1/crates/${CRATE_NAME}/${CURRENT_VERSION}")
          VERSION_ON_CRATES_IO=false
          if echo "$CRATES_IO_RESPONSE" | grep -q '"num"'; then
            VERSION_ON_CRATES_IO=true
          fi

          echo "Crate: $CRATE_NAME, Version: $CURRENT_VERSION, Published on crates.io: $VERSION_ON_CRATES_IO"

          # Check if there are changelog fragments
          if [ "${{ steps.bump_type.outputs.has_fragments }}" != "true" ]; then
            # No fragments - check if current version is published on crates.io
            if [ "$VERSION_ON_CRATES_IO" = "true" ]; then
              echo "No changelog fragments and v$CURRENT_VERSION already published on crates.io"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "No changelog fragments but v$CURRENT_VERSION not yet published to crates.io"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "skip_bump=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Found changelog fragments, proceeding with release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "skip_bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect changelog and bump version
        id: version
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.skip_bump != 'true'
        run: |
          node scripts/version-and-commit.mjs \
            --bump-type "${{ steps.bump_type.outputs.bump_type }}"

      # Everything below must not run unless the version bump was actually
      # committed (or was deliberately skipped because the current version is
      # simply not on crates.io yet). Publishing a version that was never
      # committed is how the crate reached 0.10.11 with an unchanged
      # Cargo.toml. See dev/log/issues/83/pulls/84/analysis/root-causes.md.
      - name: Get current version
        id: current_version
        if: steps.check.outputs.should_release == 'true' && (steps.version.outputs.version_committed == 'true' || steps.check.outputs.skip_bump == 'true')
        run: node ../scripts/read-manifest.mjs Cargo.toml --output version

      - name: Build release
        if: steps.check.outputs.should_release == 'true' && (steps.version.outputs.version_committed == 'true' || steps.check.outputs.skip_bump == 'true')
        run: cargo build --release

      - name: Publish to Crates.io
        if: steps.check.outputs.should_release == 'true' && (steps.version.outputs.version_committed == 'true' || steps.check.outputs.skip_bump == 'true')
        id: publish-crate
        env:
          # Note: Organization secret is named CARGO_TOKEN, we map it to CARGO_REGISTRY_TOKEN
          # which is the standard environment variable that Cargo uses for crates.io auth
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        working-directory: .
        run: node rust/scripts/publish-crate.mjs

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true' && (steps.version.outputs.version_committed == 'true' || steps.check.outputs.skip_bump == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/create-github-release.mjs \
            --release-version "${{ steps.current_version.outputs.version }}" \
            --repository "${{ github.repository }}" \
            --tag-prefix "rust-v"

  # === MANUAL RELEASE ===
  # Manual release via workflow_dispatch - only after CI passes
  manual-release:
    name: Manual Release
    needs: [lint, test, build]
    timeout-minutes: 30
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    # Note: !cancelled() is required to evaluate the condition when dependencies are skipped.
    # The build job ensures lint and test passed before this job runs.
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Changelog fragments are collected inside version-and-commit.mjs, after
      # the bump has computed the version. Collecting here instead filed the
      # notes under the version that was already released and left the new one
      # empty, because collect-changelog.mjs reads the version out of
      # Cargo.toml and this step ran before the bump wrote it.
      - name: Version and commit
        id: version
        # Both inputs are passed through the environment rather than
        # interpolated into the shell command: a `${{ ... }}` expansion is
        # substituted before the shell sees the line, so its contents are read
        # as script rather than as an argument.
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          node scripts/version-and-commit.mjs \
            --bump-type "$BUMP_TYPE" \
            --description "$RELEASE_DESCRIPTION"

      - name: Build release
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        run: cargo build --release

      - name: Publish to Crates.io
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish-crate
        env:
          # Note: Organization secret is named CARGO_TOKEN, we map it to CARGO_REGISTRY_TOKEN
          # which is the standard environment variable that Cargo uses for crates.io auth
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        working-directory: .
        run: node rust/scripts/publish-crate.mjs

      - name: Create GitHub Release
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/create-github-release.mjs \
            --release-version "${{ steps.version.outputs.new_version }}" \
            --repository "${{ github.repository }}" \
            --tag-prefix "rust-v"

  # === PIPELINE STATUS ===
  # The only job that can tell "somebody pressed stop" apart from "a check ran
  # out of time". GitHub reports a job killed by its `timeout-minutes` as
  # cancelled rather than failed, and a run whose only casualty is a cancelled
  # job carries the conclusion `cancelled` as well, so on the default branch the
  # failure would pass unannounced. See scripts/check-pipeline-status.sh.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    needs:
      - detect-changes
      - changelog
      - lint
      - test
      - no-openssl
      - coverage
      - build
      - auto-release
      - manual-release
    # A status function is required here, or the gate would inherit the implicit
    # "every dependency succeeded" condition and be skipped in exactly the runs
    # it exists to report. `!cancelled()` keeps it out of a superseded run,
    # where every job is cancelled and there is nothing to report.
    if: >-
      !cancelled()
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Fail the run when a required job was cancelled or failed
        working-directory: .
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          RUN_SHA: ${{ github.sha }}
        run: bash scripts/check-pipeline-status.sh

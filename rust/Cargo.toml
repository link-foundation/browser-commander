[package]
name = "browser-commander"
version = "0.19.0"
edition = "2021"
authors = ["Link Foundation"]
description = "Universal browser automation library that supports multiple browser engines with a unified API"
license = "Unlicense"
repository = "https://github.com/link-foundation/browser-commander"
keywords = ["browser", "automation", "testing", "e2e", "web"]
categories = ["development-tools::testing", "web-programming"]

[features]
default = []
# Opt-in escape hatch for consumers that need the system TLS stack. Enabling it
# brings openssl-sys back into the tree -- that is the caller's explicit choice.
native-tls = ["fantoccini/native-tls"]

[dependencies]
# Async runtime
tokio = { version = "1.53.2", features = ["full"] }

# Browser automation
# 0.9 dropped the runtime feature flags -- the crate is tokio-only now -- and
# its remaining TLS features only reach the optional browser fetcher, which we
# do not enable, so nothing here pulls openssl-sys in.
chromiumoxide = "0.9.1"
# default-features = false drops fantoccini's `native-tls` default, which pulls
# openssl-sys into every consumer's tree and breaks builds on images without
# pkg-config/OpenSSL headers. rustls-tls is a pure-Rust replacement.
fantoccini = { version = "0.22.1", default-features = false, features = ["rustls-tls"] }
cookie = "0.18.2"
time = "0.3.55"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"

# Installed browser cookies
aes = "0.9.3"
aes-gcm = "0.11.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
pbkdf2 = "0.13.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
sha1 = "0.11.0"
sha2 = "0.11.0"

# Profile migration: Firefox NSS logins are 3DES under a key wrapped with
# PBES2 or the legacy SHA-1/HMAC KDF, and re-encrypted Windows values need a
# random AES-GCM nonce and profile key.
des = "0.9.0"
hmac = "0.13.0"
getrandom = "0.4.3"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Regex for selector parsing
regex = "1.13.1"

# URL handling
url = "2.5.8"

# Async utilities
futures = "0.3.34"
async-tungstenite = { version = "0.35.0", features = ["tokio-runtime"] }
async-trait = "0.1.92"
tokio-util = "0.7.19"

# Directory utilities
dirs = "7.0.0"
command-stream = "1.3.0"
plist = "1.10.1"
csv = "1.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tokio-test = "0.4.6"
pretty_assertions = "1.4.1"

[[bin]]
name = "browser-commander"
path = "src/main.rs"

[lib]
name = "browser_commander"
path = "src/lib.rs"
